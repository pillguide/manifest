# The complete service account JSON stays in SSM, never in Git or the image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pillguide-backend-fcm
  namespace: dev
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: pillguide-parameter-store
    kind: SecretStore
  target:
    name: pillguide-backend-fcm
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: service-account.json
    remoteRef:
      key: /pillguide/dev/fcm-service-account
