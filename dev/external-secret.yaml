# Update values in SSM Parameter Store; Git contains only references.
# After SecretSynced, restart the Spring Pod to reload environment variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pillguide-backend-db
  namespace: dev
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: pillguide-parameter-store
    kind: SecretStore
  target:
    name: pillguide-backend-db
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: /pillguide/dev/db-password
