# CI updates the image; replicas are controlled by GitOps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pillguide-backend
  namespace: dev
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pillguide-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pillguide-backend
    spec:
      containers:
      - name: backend
        image: wien0128/pillguide-be@sha256:65daa146e8b3a1495e767020df01248e209bb95ad75de74846b1bc9418f89f4f
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: pillguide-backend-config
        - secretRef:
            name: pillguide-backend-runtime
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pillguide-backend-db
              key: password
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx512m
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 1Gi
      automountServiceAccountToken: false
