# Uses the existing EC2 instance profile; no static AWS access keys are stored here.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pillguide-parameter-store
  namespace: dev
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
