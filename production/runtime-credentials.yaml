# Values are stored in SSM SecureString; never commit credential values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pillguide-backend-runtime
  namespace: production
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: pillguide-parameter-store
    kind: SecretStore
  target:
    name: pillguide-backend-runtime
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: /pillguide/production/backend-runtime
