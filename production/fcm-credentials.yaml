# Same Firebase identity as dev, explicitly approved for production.
# Only the reference is versioned; the complete JSON stays in SSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pillguide-backend-fcm
  namespace: production
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: pillguide-parameter-store
    kind: SecretStore
  target:
    name: pillguide-backend-fcm
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: service-account.json
    remoteRef:
      key: /pillguide/production/fcm-service-account
