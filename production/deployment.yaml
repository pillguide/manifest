# CI updates the image; replicas are controlled by GitOps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pillguide-backend
  namespace: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pillguide-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pillguide-backend
    spec:
      containers:
      - name: backend
        image: wien0128/pillguide-be@sha256:a83d28571efd687447265b728723d7acd6d39a89c6db9a2d0abdf66fcf82b325
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: pillguide-backend-config
        - secretRef:
            name: pillguide-backend-runtime
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        # Temporary during development; switch back to validate when development is complete.
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pillguide-backend-db
              key: password
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx512m
        - name: FCM_ENABLED
          value: "true"
        - name: FCM_CERTIFICATION
          value: file:/var/run/secrets/firebase/service-account.json
        - name: MEDICATION_NOTIFICATION_ENABLED
          value: "true"
        volumeMounts:
        - name: firebase-credentials
          mountPath: /var/run/secrets/firebase
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 1Gi
      volumes:
      - name: firebase-credentials
        secret:
          secretName: pillguide-backend-fcm
          defaultMode: 0400
          items:
          - key: service-account.json
            path: service-account.json
      automountServiceAccountToken: false
