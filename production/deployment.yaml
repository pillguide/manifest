# CI updates the image; replicas are controlled by GitOps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pillguide-backend
  namespace: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pillguide-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pillguide-backend
    spec:
      containers:
      - name: backend
        image: wien0128/pillguide-be@sha256:9560a5731219f2419680e4bfab9a6c2a6e3b17671a9f253e25d83acf351cc92d
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: pillguide-backend-config
        - secretRef:
            name: pillguide-backend-runtime
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        # The initial schema exists; production only validates it.
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: validate
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pillguide-backend-db
              key: password
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx512m
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 1Gi
      automountServiceAccountToken: false
