# Install this Application and wait for ESO readiness before the first environment sync.
# CRDs require server-side apply; no metrics collector or logging service is installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.12.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 1
        processClusterStore: false
        processClusterExternalSecret: false
        processClusterGenerator: false
        processClusterPushSecret: false
        processPushSecret: false
        crds:
          createClusterSecretStore: false
          createClusterExternalSecret: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
        openshiftFinalizers: false
        rbac:
          serviceAccountTokenCreate: false
        serviceMonitor:
          enabled: false
        metrics:
          service:
            enabled: false
        grafanaDashboard:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          enabled: true
        readinessProbe:
          enabled: true
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - PruneLast=true
